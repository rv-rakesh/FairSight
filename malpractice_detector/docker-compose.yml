version: "3.8"

services:
  dashboard:
    build: .
    container_name: malpractice_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
      - ./test_videos:/app/test_videos
    restart: unless-stopped

  api:
    build: .
    container_name: malpractice_api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./test_videos:/app/test_videos
    restart: unless-stopped

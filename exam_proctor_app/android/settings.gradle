pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProps = file("local.properties")
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
            def path = properties.getProperty("flutter.sdk")
            if (path != null && !path.trim().isEmpty()) return path
        }
        def envPath = System.getenv("FLUTTER_ROOT")
        if (envPath != null && !envPath.trim().isEmpty()) return envPath
        throw new GradleException("flutter.sdk not set in local.properties and FLUTTER_ROOT environment variable is not set")
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.3.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
}

include ":app"

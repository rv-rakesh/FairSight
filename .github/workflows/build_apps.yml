name: Build FairSight Cross-Platform Apps (Windows EXE & Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger with 1 click

jobs:
  test-backend:
    name: Backend & Project Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Libraries for OpenCV and MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libglib2.0-0

      - name: Install Python Dependencies
        working-directory: malpractice_detector
        run: pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: malpractice_detector
        run: python -B -m pytest tests/ -v -p no:cacheprovider

      - name: Run Flutter Project Integrity Audit
        working-directory: malpractice_detector
        run: python -B scripts/validate_flutter_project.py

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'

      - name: Get Flutter Dependencies
        working-directory: exam_proctor_app
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android Gradle Wrapper Binary
        working-directory: exam_proctor_app/android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.5.0 --distribution-type all
          fi
          chmod +x gradlew

      - name: Analyze Dart Code
        working-directory: exam_proctor_app
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: exam_proctor_app
        run: flutter test

      - name: Build Release APK
        working-directory: exam_proctor_app
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FairSight-Android-APK
          path: exam_proctor_app/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter Dependencies
        working-directory: exam_proctor_app
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: exam_proctor_app
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: exam_proctor_app
        run: flutter test

      - name: Build Windows Executable
        working-directory: exam_proctor_app
        run: flutter build windows --release

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path exam_proctor_app/build/windows/bundle
          Compress-Archive -Path exam_proctor_app/build/windows/x64/runner/Release/* -DestinationPath exam_proctor_app/build/windows/bundle/FairSight-Windows-x64.zip -Force

      - name: Upload Zipped Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: FairSight-Windows-Desktop
          path: exam_proctor_app/build/windows/bundle/FairSight-Windows-x64.zip
